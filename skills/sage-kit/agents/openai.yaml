interface:
  display_name: "SAGE-Kit"
  short_description: "Model-native SPEC, execution, and review governance"
  default_prompt: >-
    Apply SAGE-Kit automatically when current project instructions select it.
    Use the lightweight project kernel for Light work; load the complete Skill
    once for Standard or Heavy work and for acceptance, review, corrective, or
    release work. Route SAGE-governed planning, implementation, milestones,
    handoff, and capability or claim-evidence trust through the relevant
    profile. Explicit $sage-kit invocation is an override or diagnostic, and a
    fallback only when the host lacks both automatic project instructions and
    implicit Skill invocation. Descendants inherit the same or narrower
    project boundary without nested Skill reloads or duplicate review. Apply
    the active SPEC, permission, evidence-owner, and human-gate boundaries.

policy:
  allow_implicit_invocation: true
