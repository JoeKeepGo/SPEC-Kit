interface:
  display_name: "SAGE-Kit"
  short_description: "SAGE-Kit adoption and adopted-project governance"
  default_prompt: >-
    Use SAGE-Kit only for an adoption request, explicit $sage-kit invocation,
    or Standard/Heavy, materially semantic review/corrective, acceptance, or
    release work when current project instructions show that SAGE-Kit is already
    adopted. Load it once per controller context; reload after compaction or
    resume when prior content is no longer observable. For
    Light work, Light review, and mechanical wording/status/EOF correction in
    an adopted project, use the lightweight project kernel and do not implicitly
    load the complete Skill unless the user explicitly overrides the kernel-only
    route. Use explicit invocation as the fallback when adoption, current
    authority, or required Skill content cannot be resolved. Absent an adoption
    request or explicit invocation, do not activate for ordinary chat, unrelated
    questions, or projects that have not adopted SAGE-Kit. Descendants inherit
    the same or narrower project boundary and selected profile identity without
    activation markers, nested Skill reloads, or duplicate review.
    Apply the active SPEC, permission, evidence-owner, and human-gate boundaries.

policy:
  allow_implicit_invocation: true
